<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>INKTIDE — Rise of the Murk</title>
  <meta name="description" content="INKTIDE: a single-player ink-splatting action adventure. Paint the town, swim through your ink, and take Tidehaven back from the Murk.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="stylesheet" href="styles/story.css">
  <link rel="stylesheet" href="styles/turf.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas" tabindex="-1" aria-label="INKTIDE game view"></canvas>
  <div id="hud-root" aria-live="polite"></div>
  <div id="ui-root"></div>
  <div id="fade" class="fade"></div>
  <div id="boot" class="boot">
    <div class="boot-logo">INKTIDE</div>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <div class="boot-tip" id="boot-tip">Mixing the ink…</div>
  </div>
  <noscript>INKTIDE needs JavaScript and WebGL2.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
