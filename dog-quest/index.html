<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Quest: Heroes of Pawtopia</title>
  <meta name="description" content="A 2D action RPG where brave dogs fight the cat army of King Leo. Keyboard & gamepad, 1-2 players.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d14; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: Fredoka, 'Trebuchet MS', sans-serif; }
    canvas { display: block; background: #10131a; box-shadow: 0 0 40px rgba(0,0,0,0.6); outline: none; }
    #loading { position: absolute; color: #ffd23f; font-size: 28px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="loading">Loading Pawtopia...</div>
  <canvas id="game" width="960" height="540" tabindex="0"></canvas>
  <script src="js/util.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>
  <script>
    window.addEventListener('load', () => { const l = document.getElementById('loading'); if (l) setTimeout(() => l.remove(), 100); });
  </script>
</body>
</html>
